# E10: steering against the kNN detector. Same setup as E7 (layer3.1, radius 0.25, K 128, 1000 steps),
# with loss knn_hinge instead of energy_hinge, evaluated with all five detectors.
#   uv run python -m actdist.train_steer --config configs/steer/scratch_mnist_layer3_knn.toml
# Keys not listed keep their default; see hyperparameters.md.

# experiment
run = "resnet18_scratch_mnist"
ood_sources = ["300k", "stl10"]
seed = 0

# steering
layer = "layer3.1"
radius = 0.25                     # x median ID activation norm at layer3.1 (1.97) = 0.49 per position
radius_mode = "rel"
swarm_size = 128
swarms = ["id2ood", "ood2id"]
init = "randn"

# loss
loss = "knn_hinge"
knn_margin = 0.05                 # kNN distances: ID median 0.094, t_D 0.25, OOD median 0.565

# optimisation
steps = 1000
lr = 1e-2
bs_id = 64
bs_ood = 64
vec_chunk = 256
log_every = 250

# detectors (knn is both attacked and evaluated; same 10 000-image ID reference)
detectors = ["energy", "msp", "maxlogit", "knn", "mahalanobis"]
knn_k = 50
ref_size = 10000
tpr = 0.95

# evaluation
alpha_steps = 41
eval_vectors = 64
n_random = 64
n_probe_id = 1000
n_probe_ood = 1000
bootstrap_B = 50
