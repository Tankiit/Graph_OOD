[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steering-ood"
version = "0.2.0"
description = "Calibrated text and vision OOD steering experiments with crossed uncertainty sources"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3"]

[project.optional-dependencies]
vision = ["torch>=2.2", "torchvision>=0.17", "skorch>=1.0", "pytorch-ood>=0.3.3,<0.4", "timm>=1,<2", "pillow>=10"]
nlp = ["torch>=2.2", "skorch>=1.0", "pytorch-ood>=0.3.3,<0.4", "sentence-transformers>=3,<6"]
test = ["pytest>=8"]

[project.scripts]
steering-ood = "steering_ood.cli:main"
steering-nlp = "steering_nlp.cli:main"

[tool.setuptools.packages.find]
include = ["steering_ood*", "steering_nlp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
