[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "representation-bank"
version = "0.1.0"
description = "Tinker adapter ladder, residual-stream cache, and intervention harness"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "safetensors>=0.4",
  "torch>=2.3",
  "transformers>=4.55",
  "zarr>=2.18,<3",
]

[project.optional-dependencies]
tinker = ["tinker>=0.7", "tinker-cookbook"]
hf = ["datasets>=3.0"]
test = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
repbank = "repbank.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/repbank"]

[tool.pytest.ini_options]
pythonpath = ["src"]
